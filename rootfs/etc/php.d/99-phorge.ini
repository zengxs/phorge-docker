; The application code is immutable inside the image. Deploy a rebuilt image
; whenever it changes instead of asking OPcache to poll source timestamps.
opcache.enable = 1
opcache.validate_timestamps = 0

; APCu is Phorge's recommended in-process data cache.
apc.enabled = 1

; Leave enough headroom for file uploads and request encoding overhead.
upload_max_filesize = 64M
post_max_size = 64M
