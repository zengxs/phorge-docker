# Container-local inputs only; Dinit supervises rsyslog directly.
global(workDirectory="/var/lib/phorge/rsyslog" maxMessageSize="64k")
module(load="imuxsock" SysSock.RateLimit.Interval="0" SysSock.FlowControl="on")

main_queue(queue.type="LinkedList" queue.size="10000"
           queue.filename="main" queue.maxDiskSpace="256m"
           queue.saveOnShutdown="on")

template(name="PhorgeLogPath" type="string"
         string="/var/log/phorge/logs/%$.logname%.log")
template(name="PhorgeLogLine" type="string"
         string="%timegenerated:::date-rfc3339% %syslogtag% %msg:::drop-last-lf%\n")

# Only known tags select filenames; other local diagnostics have a fixed sink.
if $programname == "dinit-service" then {
    set $.logname = "dinit-service";
} else if $programname == "rsyslogd" then {
    set $.logname = "rsyslog-service";
} else if $programname == "nginx_access" then {
    set $.logname = "nginx-access";
} else if $programname == "nginx_error" then {
    set $.logname = "nginx-error";
} else if $programname == "sshd" or $programname == "sshd-session" or $programname == "sshd-auth" then {
    set $.logname = "sshd-auth";
} else if $programname == "nginx-access" or $programname == "nginx-error" or
          $programname == "nginx-service" or $programname == "php-fpm-error" or
          $programname == "phorge-error" or
          $programname == "sshd-service" or $programname == "phd-daemons" or
          $programname == "phd-service" or $programname == "phorge-runtime-init" or
          $programname == "phorge-prepare" or $programname == "phorge-storage-upgrade" or
          $programname == "logrotate-service" then {
    set $.logname = $programname;
} else {
    set $.logname = "phorge-service";
}

action(type="omfile" dynaFile="PhorgeLogPath" template="PhorgeLogLine"
       fileOwner="root" fileGroup="root" fileCreateMode="0640"
       dirOwner="root" dirGroup="root" dirCreateMode="0755"
       action.resumeRetryCount="-1" action.resumeInterval="1"
       queue.type="LinkedList" queue.size="10000"
       queue.filename="files" queue.maxDiskSpace="256m"
       queue.saveOnShutdown="on" queue.timeoutShutdown="10000")
