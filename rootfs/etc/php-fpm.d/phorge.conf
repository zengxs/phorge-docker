[phorge]
user = phorge
group = phorge

listen = /run/php-fpm/phorge.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
clear_env = yes
env[PATH] = /usr/libexec/git-core:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
security.limit_extensions = .php

; Send PHP application errors directly to journald through its syslog socket.
php_admin_value[error_log] = syslog
php_admin_flag[log_errors] = on
php_admin_value[upload_tmp_dir] = /var/lib/phorge/tmp
php_admin_value[session.save_path] = /var/lib/phorge/sessions
