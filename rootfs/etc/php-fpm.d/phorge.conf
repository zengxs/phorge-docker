[phorge]
user = phorge
group = phorge

listen = /run/php-fpm/phorge.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

security.limit_extensions = .php

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = syslog
php_admin_value[syslog.ident] = phorge-error

clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin:/usr/libexec/git-core
env[TMP] = /var/lib/phorge/tmp
env[TMPDIR] = /var/lib/phorge/tmp
env[TEMP] = /var/lib/phorge/tmp

php_value[session.save_handler] = files
php_value[session.save_path] = /var/lib/phorge/sessions
php_value[opcache.file_cache] = /var/lib/phorge/opcache
